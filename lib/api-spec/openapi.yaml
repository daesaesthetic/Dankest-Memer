openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discord
    description: Discord connection operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /discord/status:
    get:
      operationId: getDiscordStatus
      tags: [discord]
      summary: Get Discord bot connection status
      description: Returns safe connection details for the configured Discord bot.
      responses:
        "200":
          description: Discord connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DiscordStatus:
      type: object
      properties:
        connected:
          type: boolean
        botName:
          type: ["string", "null"]
        botTag:
          type: ["string", "null"]
        guildCount:
          type: number
        message:
          type: string
      required:
        - connected
        - botName
        - botTag
        - guildCount
        - message

